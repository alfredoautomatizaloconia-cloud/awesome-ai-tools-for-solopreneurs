name: Sync from StackBuilt

on:
  workflow_dispatch:
  schedule:
    - cron: "0 7 * * 1"

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Sync data and rebuild README
        run: npm run sync

      - name: Create pull request
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore: sync tool list from stackbuilt"
          title: "chore: sync tool list from stackbuilt"
          body: "Automated weekly sync from stackbuilt.co export."
          branch: "chore/sync-tool-list"
          delete-branch: true
